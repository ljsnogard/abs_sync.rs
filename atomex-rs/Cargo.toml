[package]
edition = "2024"
name = "atomex"
version = "0.1.2"

authors = ["lino <lino_snsalias@outlook.com>"]
description = "Atomics extensions in Rust"
repository = "https://github.com/ljsnogard/abs_sync.rs"
keywords = ["atomic", "traits"]
categories = ["algorithms", "no-std"]
license.workspace = true
readme = "README.md"

[features]
support_u128_i128_atomics = []
default = ["support_u128_i128_atomics"]

[dependencies]
funty = { version = "3.0.0-rc2", default-features = false }
